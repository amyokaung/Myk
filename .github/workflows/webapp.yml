name: Myk Web App Test

on:
  workflow_dispatch:
  push:
    branches: [webapp-test]

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Web TypeScript check
        run: npx tsc -p tsconfig.web.json --noEmit

      - name: Build web app
        run: npm run web:build

      - name: Upload web dist
        uses: actions/upload-artifact@v4
        with:
          name: myk-webapp-dist
          path: dist

      - name: Verify PWA files
        run: |
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          test -f dist/icons/myk-icon.svg
          echo "PWA files verified"
