name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [rn-debug-diagnostic]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager             "platforms;android-36"             "build-tools;36.0.0"             "ndk;27.1.12297006"             "cmake;3.31.6"

      - name: Install JavaScript dependencies
        run: npm install

      - name: Remove optional llama native binary for isolation
        run: |
          rm -rf android/app/src/main/jniLibs

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build pure React Native release APK
        run: |
          cd android
          gradle clean assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: myanmar-offline-ai-pure-rn-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
