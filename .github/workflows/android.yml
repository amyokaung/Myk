name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, diagnostic-crash-logger, diagnostic-native-only]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.31.6"
      - name: Install JavaScript dependencies
        run: npm install
      - name: Build llama-server for Android arm64
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git cpp/llama.cpp
          cmake -S cpp/llama.cpp -B cpp/llama-build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_shared -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DGGML_VULKAN=OFF \
            -DGGML_CUDA=OFF -DGGML_METAL=OFF -DGGML_LLAMAFILE=OFF \
            -DLLAMA_CURL=OFF -DLLAMA_BUILD_SERVER=ON
          cmake --build cpp/llama-build --config Release --target llama-server -j2
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp cpp/llama-build/bin/llama-server android/app/src/main/jniLibs/arm64-v8a/libllamaserver.so
          cp "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" android/app/src/main/jniLibs/arm64-v8a/libc++_shared.so
          chmod 755 android/app/src/main/jniLibs/arm64-v8a/libllamaserver.so
          file android/app/src/main/jniLibs/arm64-v8a/libllamaserver.so
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Build release APK
        run: |
          cd android
          gradle clean assembleRelease --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: myanmar-offline-ai-release-native-only
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
