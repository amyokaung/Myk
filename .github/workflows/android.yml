name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout app
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Setup Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 4. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # 5. Install required Android SDK packages
      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.31.6"

      # 6. Install JavaScript dependencies
      - name: Install JavaScript dependencies
        run: |
          npm install

      # 7. Build llama-server for Android arm64
      - name: Build llama-server for Android arm64
        shell: bash
        run: |
          set -euxo pipefail

          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"

          # Clone latest llama.cpp
          git clone --depth 1 \
            https://github.com/ggml-org/llama.cpp.git \
            cpp/llama.cpp

          # Configure llama.cpp
          cmake \
            -S cpp/llama.cpp \
            -B cpp/llama-build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_VULKAN=OFF \
            -DGGML_CUDA=OFF \
            -DGGML_METAL=OFF \
            -DGGML_LLAMAFILE=OFF \
            -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_SERVER=ON

          # Build llama-server
          cmake \
            --build cpp/llama-build \
            --config Release \
            --target llama-server \
            -j2

          # Create Android native library directory
          mkdir -p android/app/src/main/jniLibs/arm64-v8a

          # Copy llama-server
          cp \
            cpp/llama-build/bin/llama-server \
            android/app/src/main/jniLibs/arm64-v8a/libllamaserver.so

          # Copy Android C++ runtime
          cp \
            "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" \
            android/app/src/main/jniLibs/arm64-v8a/libc++_shared.so

          # Make executable
          chmod 755 \
            android/app/src/main/jniLibs/arm64-v8a/libllamaserver.so

          # Verify binary
          echo "===== llama-server ====="
          ls -lh android/app/src/main/jniLibs/arm64-v8a/
          file android/app/src/main/jniLibs/arm64-v8a/libllamaserver.so

      # 8. Build release APK
      - name: Build release APK
        run: |
          cd android

          chmod +x gradlew

          ./gradlew \
            clean \
            assembleRelease \
            --no-daemon

      # 9. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: myanmar-offline-ai-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
