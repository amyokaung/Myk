name: Myk Capacitor Android APK

on:
  workflow_dispatch:
  push:
    branches: [capacitor-test, capacitor-myk-ui]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Myk
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Web TypeScript check
        run: npx tsc -p tsconfig.web.json --noEmit

      - name: Build web app
        run: npm run web:build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Create clean Capacitor Android platform
        run: |
          rm -rf android
          npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Capacitor debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: myk-capacitor-ui-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
