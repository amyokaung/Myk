name: Myk Capacitor Android APK

concurrency:
  group: myk-capacitor-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [capacitor-test, capacitor-myk-ui]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Myk
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Web TypeScript check
        run: npx tsc -p tsconfig.web.json --noEmit

      - name: Build web app
        run: npm run web:build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager             "platforms;android-36"             "build-tools;36.0.0"             "ndk;27.1.12297006"             "cmake;3.31.6"

      - name: Create clean Capacitor Android platform
        run: |
          rm -rf android
          npx cap add android

      - name: Cache llama.cpp Android build
        uses: actions/cache@v4
        with:
          path: |
            cpp/llama.cpp
            cpp/llama-build
          key: myk-llama-arm64-v1-${{ runner.os }}-${{ hashFiles('.github/workflows/capacitor.yml') }}

      - name: Build llama-server for Android arm64
        shell: bash
        run: |
          set -euxo pipefail

          if [ ! -d cpp/llama.cpp/.git ]; then
            git clone --depth 1 https://github.com/ggml-org/llama.cpp.git cpp/llama.cpp
          fi

          if [ -x cpp/llama-build/bin/llama-server ]; then
            echo "Cached llama-server found; skipping llama.cpp rebuild."
          else
            cmake             -S cpp/llama.cpp             -B cpp/llama-build             -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"             -DANDROID_ABI=arm64-v8a             -DANDROID_PLATFORM=android-24             -DANDROID_STL=c++_shared             -DCMAKE_BUILD_TYPE=Release             -DGGML_NATIVE=OFF             -DGGML_OPENMP=OFF             -DGGML_VULKAN=OFF             -DGGML_CUDA=OFF             -DGGML_METAL=OFF             -DGGML_LLAMAFILE=OFF             -DLLAMA_CURL=OFF             -DLLAMA_BUILD_SERVER=ON

            cmake --build cpp/llama-build --config Release --target llama-server -j2
          fi

          test -x cpp/llama-build/bin/llama-server
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp cpp/llama-build/bin/llama-server android/app/src/main/jniLibs/arm64-v8a/libllamaserver.so

          # llama-server is a small launcher that dynamically depends on the
          # llama.cpp shared libraries produced beside it. Package all of them
          # into nativeLibraryDir so ProcessBuilder can resolve them at runtime.
          find cpp/llama-build/bin -maxdepth 1 -type f -name '*.so' -exec cp {} android/app/src/main/jniLibs/arm64-v8a/ \;

          cp "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" android/app/src/main/jniLibs/arm64-v8a/libc++_shared.so
          chmod 755 android/app/src/main/jniLibs/arm64-v8a/*.so
          file android/app/src/main/jniLibs/arm64-v8a/libllamaserver.so
          ls -lh android/app/src/main/jniLibs/arm64-v8a/

      - name: Install Myk native bridges
        run: |
          mkdir -p android/app/src/main/java/com/myanmarofflineai/myk
          cp capacitor/android/MykModelPlugin.java android/app/src/main/java/com/myanmarofflineai/myk/MykModelPlugin.java
          cp capacitor/android/MykAIPlugin.java android/app/src/main/java/com/myanmarofflineai/myk/MykAIPlugin.java
          cp capacitor/android/MainActivity.java android/app/src/main/java/com/myanmarofflineai/myk/MainActivity.java

      - name: Configure stable app version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          p = Path("android/app/build.gradle")
          s = p.read_text()
          version_code = 1000 + int(os.environ["GITHUB_RUN_NUMBER"])
          version_name = f"1.0.{os.environ['GITHUB_RUN_NUMBER']}"
          s = s.replace("versionCode 1", f"versionCode {version_code}")
          s = s.replace('versionName "1.0"', f'versionName "{version_name}"')
          p.write_text(s)
          print(f"Myk versionCode={version_code} versionName={version_name}")
          PY

      - name: Configure stable APK signing
        env:
          MYK_KEYSTORE_B64: ${{ secrets.MYK_KEYSTORE_B64 }}
          MYK_KEYSTORE_PASSWORD: ${{ secrets.MYK_KEYSTORE_PASSWORD }}
          MYK_KEY_ALIAS: ${{ secrets.MYK_KEY_ALIAS }}
          MYK_KEY_PASSWORD: ${{ secrets.MYK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${MYK_KEYSTORE_B64}" || { echo "MYK_KEYSTORE_B64 is missing"; exit 1; }
          test -n "${MYK_KEYSTORE_PASSWORD}" || { echo "MYK_KEYSTORE_PASSWORD is missing"; exit 1; }
          test -n "${MYK_KEY_ALIAS}" || { echo "MYK_KEY_ALIAS is missing"; exit 1; }
          test -n "${MYK_KEY_PASSWORD}" || { echo "MYK_KEY_PASSWORD is missing"; exit 1; }
          printf '%s' "${MYK_KEYSTORE_B64}" | base64 --decode > android/myk-release.keystore
          test -s android/myk-release.keystore
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          marker = "android {"
          if "mykStable" not in s:
              block = """android {
                  signingConfigs {
                      mykStable {
                          storeFile file("../myk-release.keystore")
                          storePassword System.getenv("MYK_KEYSTORE_PASSWORD")
                          keyAlias System.getenv("MYK_KEY_ALIAS")
                          keyPassword System.getenv("MYK_KEY_PASSWORD")
                      }
                  }"""
              if marker not in s:
                  raise SystemExit("android block not found")
              s = s.replace(marker, block, 1)
          s = s.replace("signingConfig signingConfigs.debug", "signingConfig signingConfigs.mykStable")
          p.write_text(s)
          PY
          keytool -list -keystore android/myk-release.keystore -storepass "${MYK_KEYSTORE_PASSWORD}" -alias "${MYK_KEY_ALIAS}" -noprompt >/dev/null
          echo "Stable signing keystore validated."

      - name: Force native library extraction
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          s = p.read_text()
          marker = "android {"
          block = """android {
              packagingOptions {
                  jniLibs {
                      useLegacyPackaging true
                  }
              }"""
          if "useLegacyPackaging true" not in s:
              if marker not in s:
                  raise SystemExit("android block not found in app/build.gradle")
              s = s.replace(marker, block, 1)
              p.write_text(s)
          PY

          grep -n -A6 "packagingOptions" android/app/build.gradle

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Allow local AI HTTP loopback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          if 'android:usesCleartextTraffic="true"' not in s:
              s = s.replace("<application", '<application android:usesCleartextTraffic="true"', 1)
              p.write_text(s)
          PY
          grep -n "usesCleartextTraffic" android/app/src/main/AndroidManifest.xml

      - name: Build Capacitor debug APK
        working-directory: android
        env:
          MYK_KEYSTORE_PASSWORD: ${{ secrets.MYK_KEYSTORE_PASSWORD }}
          MYK_KEY_ALIAS: ${{ secrets.MYK_KEY_ALIAS }}
          MYK_KEY_PASSWORD: ${{ secrets.MYK_KEY_PASSWORD }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK and llama-server packaging
        run: |
          set -euxo pipefail
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          test -s android/app/src/main/jniLibs/arm64-v8a/libllamaserver.so
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/libllamaserver.so'
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/libc++_shared.so'
          for lib in android/app/src/main/jniLibs/arm64-v8a/*.so; do
            base="$(basename "$lib")"
            unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep "lib/arm64-v8a/$base"
          done
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: myk-capacitor-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
