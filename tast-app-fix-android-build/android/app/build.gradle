plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "com.facebook.react"
}

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false

android {
    namespace "com.myanmarofflineai"
    compileSdk rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    defaultConfig {
        applicationId "com.myanmarofflineai"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"

        // The bundled llama-server binary is built for this ABI.
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    ndkVersion rootProject.ext.ndkVersion

    // llama-server is an executable packaged in jniLibs and must be extracted
    // to the application's nativeLibraryDir before ProcessBuilder can execute it.
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += [
                "META-INF/AL2.0",
                "META-INF/LGPL2.1"
            ]
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }

        release {
            minifyEnabled enableProguardInReleaseBuilds
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile(
                "proguard-android-optimize.txt"
            ), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")
}
