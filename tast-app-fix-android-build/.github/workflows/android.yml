name: Android Build

on:
  push:
    branches:
      - main
      - fix/android-build
  pull_request:
    branches:
      - main

jobs:
  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: ''
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.31.6" \
            "ndk;27.1.12297006"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Install npm dependencies
        shell: bash
        run: |
          set -e
          npm install

      # llama.cpp is deliberately NOT linked into the React Native process.
      # We build its HTTP server as a standalone Android executable instead.
      - name: Clone llama.cpp
        shell: bash
        run: |
          set -e
          rm -rf cpp/llama.cpp
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git cpp/llama.cpp

      - name: Build standalone llama-server
        shell: bash
        run: |
          set -e

          NDK="$ANDROID_SDK_ROOT/ndk/27.1.12297006"
          TOOLCHAIN="$NDK/build/cmake/android.toolchain.cmake"

          cmake \
            -S cpp/llama.cpp \
            -B cpp/llama-build \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_VULKAN=OFF \
            -DGGML_CUDA=OFF \
            -DGGML_METAL=OFF \
            -DGGML_LLAMAFILE=OFF \
            -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_SERVER=ON

          cmake \
            --build cpp/llama-build \
            --target llama-server \
            --config Release \
            --parallel 2

          SERVER="cpp/llama-build/bin/llama-server"

          if [ ! -f "$SERVER" ]; then
            echo "ERROR: llama-server was not produced."
            find cpp/llama-build -type f -name "*llama*server*" -print || true
            exit 1
          fi

          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp "$SERVER" \
            android/app/src/main/jniLibs/arm64-v8a/libllamaserver.so

          # llama-server uses the NDK shared C++ runtime.
          cp "$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" \
            android/app/src/main/jniLibs/arm64-v8a/libc++_shared.so

          chmod 755 \
            android/app/src/main/jniLibs/arm64-v8a/libllamaserver.so

          ls -lh android/app/src/main/jniLibs/arm64-v8a/

      - name: Build Release APK
        working-directory: android
        shell: bash
        run: |
          set -e
          gradle assembleRelease --stacktrace --info

      - name: Verify Release APK
        shell: bash
        run: |
          set -e
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"

          test -f "$APK_PATH"

          echo "Release APK:"
          ls -lh "$APK_PATH"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: myanmar-offline-ai-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
